<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TicketHub</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2030;--mut:#6b7280;--pri:#4f46e5;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1e2a;--ink:#e8eaf2;--mut:#9aa0b4;--line:#2b3042}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}
nav a{margin-left:16px;cursor:pointer;color:var(--pri);font-weight:600}nav span{margin-left:16px;color:var(--mut)}
main{max-width:900px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}button.bad{background:var(--bad)}button.ok{background:var(--ok)}button:disabled{opacity:.5}
input{width:100%;padding:10px;margin:6px 0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.mut{color:var(--mut);font-size:14px}.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.CONFIRMED,.SUCCESS{background:var(--ok)}.PENDING,.CREATED{background:var(--warn)}.FAILED,.REFUND_REQUIRED{background:var(--bad)}.CANCELLED,.EXPIRED{background:#6b7280}
.stage{text-align:center;background:var(--line);border-radius:6px;padding:4px;margin:6px auto 16px;width:60%;font-size:12px;color:var(--mut)}
.grid{display:flex;flex-direction:column;gap:6px;align-items:center}.srow{display:flex;gap:6px}
.seat{width:38px;height:34px;padding:0;font-size:12px;background:var(--card);color:var(--ink);border:1px solid var(--pri)}
.seat.sel{background:var(--pri);color:#fff}.seat.RESERVED{background:#fde68a;color:#78350f;border-color:#f59e0b}.seat.BOOKED{background:#9ca3af;border-color:#9ca3af;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
code{font-size:12px;word-break:break-all}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}#modal .box{background:var(--card);padding:24px;border-radius:14px;width:min(360px,92vw)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;color:#fff;display:none}
</style></head><body>
<header><b>🎟 TicketHub</b><nav id="nav"></nav></header>
<main id="app"></main><div id="modal"><div class="box" id="mbox"></div></div><div id="toast"></div>
<script src="app.js"></script></body></html>
